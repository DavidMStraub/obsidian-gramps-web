name: Release Obsidian plugin

# Builds the plugin and attaches main.js, manifest.json and styles.css to a
# release created manually on GitHub. Tag the release with the exact version
# from manifest.json, without a leading "v".
on:
    release:
        types: [published]

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            id-token: write
            attestations: write
        steps:
            - uses: actions/checkout@v6

            - name: Check tag matches manifest version
              env:
                  TAG: ${{ github.event.release.tag_name }}
              run: |
                  version=$(jq -r .version manifest.json)
                  if [ "$TAG" != "$version" ]; then
                    echo "::error::Release tag '$TAG' does not match manifest.json version '$version'"
                    exit 1
                  fi

            - name: Use Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: 'npm'

            - name: Build plugin
              run: |
                  npm ci
                  npm test
                  npm run build

            - name: Check for optional styles
              id: styles
              run: |
                  [ -f styles.css ] && echo "exists=true" >> "$GITHUB_OUTPUT" || echo "exists=false" >> "$GITHUB_OUTPUT"

            - name: Attest build provenance
              uses: actions/attest@v4
              with:
                  subject-path: |
                      main.js
                      ${{ steps.styles.outputs.exists == 'true' && 'styles.css' || '' }}

            - name: Upload release assets
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TAG: ${{ github.event.release.tag_name }}
                  NAME: ${{ github.event.release.name }}
              run: |
                  # Obsidian's review requires the version in the release name
                  if [ -z "$NAME" ]; then
                    gh release edit "$TAG" --title "$TAG"
                  fi
                  gh release upload "$TAG" --clobber \
                    main.js manifest.json ${{ steps.styles.outputs.exists == 'true' && 'styles.css' || '' }}
